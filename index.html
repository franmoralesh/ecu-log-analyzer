<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ECU Log Analyzer</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="detector.js"></script>
    <script src="utils.js"></script>
    <script src="csv.js"></script>
    <script src="app.js"></script>
    <style>
        body{
            font-family:Arial;
            background:#111;
            color:white;
            margin:30px;
        }

        h1{
            margin-bottom:5px;
        }

        #drop{
            border:3px dashed #555;
            padding:50px;
            text-align:center;
            border-radius:12px;
            margin-top:30px;
            cursor:pointer;
        }

        #graph{
            margin-top:30px;
            width:100%;
            height:700px;
        }
    </style>

</head>

<body>

<h1>ECU Log Analyzer</h1>

<p>Versión 0.1</p>

<input type="file" id="csv">

<div id="graph"></div>

<script>

document
.getElementById("csv")
.addEventListener("change", loadCSV);

function loadCSV(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        parseCSV(e.target.result);

    };

    reader.readAsText(file);

}

function parseCSV(csv){

   const lines = csv.trim().split(/\r?\n/);

const headers = splitCSVLine(lines[0])
    .map(h => h.trim());

const data = [];

for(let i = 1; i < lines.length; i++){

    const values = splitCSVLine(lines[i]);

    const row = {};

    headers.forEach((header,index)=>{
            let value = values[index] ?? "";

    value = value.trim();

    const number = Number(value);

    row[header] = isNaN(number) ? value : number;

        });

        data.push(row);

    }

    console.clear();

    console.log("Columnas:");

    console.table(headers);

   console.log(data);

const detected = detectSignals(headers);

console.log("Señales detectadas:");

console.table(detected);

showColumns(headers, detected);
const rpm = getColumn(data, detected.rpm);

console.log("RPM:");

console.log(rpm);
}

function showColumns(headers, detected){

    const graph = document.getElementById("graph");

    graph.innerHTML = "<h2>Variables detectadas</h2>";

    for(const signal in detected){

        const value = detected[signal];

        if(value){

            graph.innerHTML +=
                "<div>✅ <b>"+signal+"</b> → "+value+"</div>";

        }else{

            graph.innerHTML +=
                "<div>❌ <b>"+signal+"</b> no encontrada</div>";

        }

    }

}

</script>
</body>

</html>
