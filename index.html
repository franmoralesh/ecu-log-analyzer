<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ECU Log Analyzer</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <style>
        body{
            font-family:Arial;
            background:#111;
            color:white;
            margin:30px;
        }

        h1{
            margin-bottom:5px;
        }

        #drop{
            border:3px dashed #555;
            padding:50px;
            text-align:center;
            border-radius:12px;
            margin-top:30px;
            cursor:pointer;
        }

        #graph{
            margin-top:30px;
            width:100%;
            height:700px;
        }
    </style>

</head>

<body>

<h1>ECU Log Analyzer</h1>

<p>Versión 0.1</p>

<input type="file" id="csv">

<div id="graph"></div>

<script>

document
.getElementById("csv")
.addEventListener("change",readFile);

function readFile(e){

const file=e.target.files[0];

const reader=new FileReader();

reader.onload=function(event){

const text=event.target.result;

const rows=text.split("\n");

const headers=rows[0].split(",");

console.log(headers);

alert("CSV cargado correctamente.\n\nColumnas detectadas: "+headers.length);

}

reader.readAsText(file);

}

</script>

</body>

</html>
